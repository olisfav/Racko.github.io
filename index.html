<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACKO — Fashion Boosts Confidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15140f;
    --panel:#2e2e2c;
    --panel-soft:#37362f;
    --gold:#c9a228;
    --gold-light:#e3c468;
    --gold-dim:#7a6323;
    --cream:#ede6d6;
    --cream-dim:#a89f8c;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(201,162,40,0.05), transparent 60%),
      var(--panel);
    color:var(--cream);
    font-family:'Jost', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  .page{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- logo ---------- */
  .mark{
    width:100%;
    max-width:420px;
    opacity:0;
    transform:translateY(14px);
    animation:rise 900ms cubic-bezier(.2,.8,.2,1) 120ms forwards;
  }
  .mark img{
    display:block;
    width:100%;
    height:auto;
  }

  @keyframes rise{
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- claw divider ---------- */
  .claw{
    width:96px;
    height:34px;
    margin:30px 0 26px;
    opacity:0;
    animation:rise 900ms cubic-bezier(.2,.8,.2,1) 320ms forwards;
  }
  .claw path{
    fill:none;
    stroke:var(--gold-dim);
    stroke-width:2;
    stroke-linecap:round;
  }

  /* ---------- intro line ---------- */
  .invite{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(20px,4vw,26px);
    color:var(--cream);
    margin:0 0 6px;
    opacity:0;
    animation:rise 900ms cubic-bezier(.2,.8,.2,1) 440ms forwards;
  }
  .sub{
    font-family:'Jost', sans-serif;
    font-size:12px;
    font-weight:400;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--cream-dim);
    margin:0 0 44px;
    opacity:0;
    animation:rise 900ms cubic-bezier(.2,.8,.2,1) 520ms forwards;
  }

  /* ---------- link cards ---------- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
    opacity:0;
    animation:rise 900ms cubic-bezier(.2,.8,.2,1) 620ms forwards;
  }

  .card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:20px 24px;
    background:var(--panel-soft);
    border:1px solid #4c4a3d;
    border-radius:2px;
    text-decoration:none;
    color:var(--cream);
    overflow:hidden;
    isolation:isolate;
    transition:border-color 320ms ease, transform 320ms ease, background 320ms ease;
  }

  .card:hover, .card:focus-visible{
    border-color:var(--gold-dim);
    background:#403e34;
    transform:translateY(-2px);
  }
  .card:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  .card .icon{
    flex:0 0 auto;
    width:22px;
    height:22px;
    color:var(--gold);
  }
  .card .icon svg{ width:100%; height:100%; display:block; }

  .card .text{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
  }
  .card .platform{
    font-family:'Jost', sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--cream-dim);
  }
  .card .handle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:22px;
    color:var(--cream);
  }

  .card .arrow{
    flex:0 0 auto;
    font-family:'Cormorant Garamond', serif;
    font-size:22px;
    color:var(--gold);
    transform:translateX(-4px);
    opacity:0;
    transition:transform 320ms ease, opacity 320ms ease;
  }
  .card:hover .arrow, .card:focus-visible .arrow{
    transform:translateX(0);
    opacity:1;
  }

  /* claw-scratch reveal on hover */
  .card .scratch{
    position:absolute;
    right:-6px;
    top:50%;
    transform:translateY(-50%) translateX(10px);
    width:64px;
    height:64px;
    opacity:0;
    transition:opacity 380ms ease, transform 380ms ease;
    z-index:-1;
    pointer-events:none;
  }
  .card .scratch path{
    fill:none;
    stroke:var(--gold);
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:80;
    stroke-dashoffset:80;
    transition:stroke-dashoffset 480ms ease;
  }
  .card:hover .scratch, .card:focus-visible .scratch{
    opacity:.5;
    transform:translateY(-50%) translateX(0);
  }
  .card:hover .scratch path, .card:focus-visible .scratch path{
    stroke-dashoffset:0;
  }

  /* ---------- footer ---------- */
  footer{
    margin-top:46px;
    font-size:10.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#6b6455;
    opacity:0;
    animation:rise 900ms cubic-bezier(.2,.8,.2,1) 720ms forwards;
  }

  @media (min-width:560px){
    .links{ flex-direction:row; }
    .card{ flex-direction:column; align-items:flex-start; gap:14px; padding:26px 24px 22px; }
    .card .arrow{ position:absolute; top:22px; right:22px; }
    .card .scratch{ right:-10px; top:auto; bottom:-10px; transform:translateX(10px);}
    .card:hover .scratch, .card:focus-visible .scratch{ transform:translateX(0); }
  }
</style>
</head>
